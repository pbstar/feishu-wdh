<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>飞书文档导出助手</title>
    <link rel="stylesheet" href="../styles/base.css" />
    <link rel="stylesheet" href="./popup.css" />
  </head>
  <body>
    <div class="popup">
      <header class="popup-header">
        <h1 class="popup-title">飞书文档导出助手</h1>
      </header>

      <p class="popup-desc">将当前飞书文档导出为 Markdown，图片打包为 ZIP。</p>

      <button id="export-btn" class="btn-primary export-btn">导出 Markdown</button>

      <div id="status" class="status" hidden>
        <div class="status-row">
          <span id="spinner" class="spinner" hidden></span>
          <span id="status-text" class="status-text"></span>
        </div>
        <div class="progress-track" id="progress-track" hidden>
          <div class="progress-bar" id="progress-bar"></div>
        </div>
      </div>
    </div>

    <script type="module" src="./popup.ts"></script>
  </body>
</html>
